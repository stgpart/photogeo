<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PhotoGeo">
<title>PhotoGeo</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- Sign-in / setup screen -->
<div id="signin" class="screen hidden">
  <div class="signin-card">
    <img src="icon-192.png" alt="" class="signin-logo">
    <h1>PhotoGeo</h1>
    <p class="muted">Your shooting-location journal</p>
    <button id="btnSignIn" class="btn primary big">Sign in with Google</button>
    <p id="setupNote" class="setup-note hidden">PhotoGeo isn't connected to Firebase yet. Fill in the config at the top of <code>app.js</code> (see SETUP.md).</p>
  </div>
</div>

<!-- Main app -->
<div id="app" class="hidden">
  <div id="map"></div>

  <header class="topbar">
    <div class="brand">PhotoGeo</div>
    <div class="topbar-actions">
      <button id="btnSearch" class="chip" title="Search an address">⌕ Search</button>
      <button id="btnLayer" class="chip" title="Map layers">◫ Layers</button>
      <button id="btnAccount" class="avatar" title="Account">?</button>
    </div>
  </header>

  <button id="filterPill" class="filter-pill hidden" title="Show all spots"></button>

  <!-- Address search -->
  <div id="searchBar" class="search-bar hidden">
    <div class="search-row">
      <input id="searchInput" type="search" placeholder="Address, place, or 36.52, -121.92" autocomplete="off" enterkeyhint="search">
      <button id="searchClose" class="icon-btn" title="Close">✕</button>
    </div>
    <div id="searchResults" class="search-results"></div>
  </div>
  <div id="searchCard" class="search-card hidden">
    <div class="sc-text"><b id="searchCardName"></b><small id="searchCardDetail"></small></div>
    <div class="sc-btns">
      <button id="searchDismiss" class="btn small">Close</button>
      <button id="searchAdjust" class="btn small">Adjust pin</button>
      <button id="searchSave" class="btn small primary">Save as spot</button>
    </div>
  </div>

  <div id="banner" class="banner hidden">
    <span id="bannerText"></span>
    <button id="bannerBtn" class="btn small primary">Connect</button>
  </div>

  <!-- Place-a-spot mode -->
  <div id="crosshair" aria-hidden="true"></div>
  <div id="placeBar" class="place-bar">
    <span id="placeText">Move the map to put the pin on the spot</span>
    <div class="place-btns">
      <button id="placeCancel" class="btn small">Cancel</button>
      <button id="placeConfirm" class="btn small primary">Save here</button>
    </div>
  </div>

  <nav class="bottombar">
    <button id="btnList" class="tool" title="All spots"><span>☰</span><small>Spots</small></button>
    <button id="btnAddSpot" class="tool" title="Add a spot by hand"><span>📍</span><small>Pin</small></button>
    <button id="btnAddPhoto" class="fab">📷 Add photo</button>
    <button id="btn3d" class="tool" title="3D terrain"><span>⛰</span><small>3D</small></button>
    <button id="btnLocate" class="tool" title="My location"><span>◎</span><small>Me</small></button>
  </nav>

  <!-- Spot sheet -->
  <section id="sheet" class="sheet hidden" aria-label="Spot details">
    <div class="sheet-handle"></div>
    <div class="sheet-head">
      <div class="sheet-title">
        <h2 id="spotName"></h2>
        <button id="spotCoords" class="coords" title="Copy coordinates"></button>
        <div id="spotTags" class="tags"></div>
      </div>
      <button id="sheetClose" class="icon-btn" title="Close">✕</button>
    </div>
    <div class="sheet-actions">
      <a id="spotDirections" class="btn small" target="_blank" rel="noopener">🧭 Directions</a>
      <button id="spotAddPhoto" class="btn small primary">📷 Add photo here</button>
      <button id="spotMore" class="btn small">⋯</button>
    </div>
    <div id="spotArea" class="spot-area"></div>
    <label class="field-label" for="spotNotes">Notes</label>
    <textarea id="spotNotes" rows="3" placeholder="Parking, access, best angles, tide, crowds…"></textarea>
    <div class="grid-head"><span id="spotCount"></span></div>
    <div id="spotGrid" class="photo-grid"></div>
  </section>

  <!-- Spot list -->
  <section id="listSheet" class="sheet tall hidden" aria-label="All spots">
    <div class="sheet-handle"></div>
    <div class="sheet-head">
      <h2>Spots</h2>
      <button id="listClose" class="icon-btn" title="Close">✕</button>
    </div>
    <div id="listFilters" class="filters"></div>
    <label class="area-pick"><span>Area</span><select id="areaSelect"><option value="">All areas</option></select></label>
    <input id="listSearch" type="search" placeholder="Search spots, notes, captions, parks, towns">
    <div id="listItems" class="list"></div>
  </section>

  <!-- Layers -->
  <section id="layersSheet" class="sheet hidden" aria-label="Map layers">
    <div class="sheet-handle"></div>
    <div class="sheet-head">
      <h2>Map layers</h2>
      <button id="layersClose" class="icon-btn" title="Close">✕</button>
    </div>
    <div id="layersBody"></div>
  </section>

  <!-- Photo viewer -->
  <div id="viewer" class="viewer hidden">
    <button id="viewerClose" class="icon-btn viewer-close" title="Close">✕</button>
    <div class="viewer-stage">
      <div id="viewerTrack" class="viewer-track"></div>
      <button id="viewerPrev" class="viewer-arrow prev" title="Previous photo">‹</button>
      <button id="viewerNext" class="viewer-arrow next" title="Next photo">›</button>
      <div id="viewerCount" class="viewer-count"></div>
    </div>
    <div class="viewer-info">
      <label class="field-label" for="viewerCaption">Caption</label>
      <textarea id="viewerCaption" rows="2" maxlength="500" placeholder="Add a caption for this photo…"></textarea>
      <div id="viewerMeta"></div>
      <button id="viewerDelete" class="btn small danger">Delete photo</button>
    </div>
  </div>

  <input type="file" id="fileInput" accept="image/*" multiple hidden>
</div>

<div id="dialog" class="dialog hidden"></div>
<div id="toast" class="toast" role="status"></div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/exifr@7.1.3/dist/full.umd.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="app.js"></script>
</body>
</html>
